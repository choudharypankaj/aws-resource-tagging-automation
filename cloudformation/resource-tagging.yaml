AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Automated AWS resource tagging for ownership and cost visibility.
  Derived from aws-samples/resource-tagging-automation (MIT-0); extended with
  derived owner resolution, parent-pointer inheritance, a reconciliation sweep
  and an AWS Config detective rule. See NOTICE.

Parameters:
  RoleOwnerMap:
    Type: String
    Default: '{"AWSServiceRoleForAutoScaling":"inherit"}'
    Description: >-
      JSON map of IAM role name to owning team. Use the sentinel "inherit" for
      roles whose resources should take Owner from their parent object.
  TrailName:
    Type: String
    Default: resource-tagging-trail
  TrailS3Bucket:
    Type: String
    Default: ''
    Description: Existing bucket for CloudTrail logs. Leave blank to create one.
  SweepSchedule:
    Type: String
    Default: rate(30 minutes)
  EnableConfigRule:
    Type: String
    Default: 'false'
    AllowedValues: ['true','false']
    Description: >-
      Deploy the AWS Config detective rule. Requires an AWS Config configuration
      recorder to already exist in this account and Region; set to 'false' if
      Config is not enabled (AWS::Config::ConfigRule fails with
      NoAvailableConfigurationRecorder otherwise).

Conditions:
  CreateBucket: !Equals [!Ref TrailS3Bucket, '']
  UseExistingBucket: !Not [!Equals [!Ref TrailS3Bucket, '']]
  WantConfigRule: !Equals [!Ref EnableConfigRule, 'true']

Resources:

  # ---------- Step 1: audit data ----------
  TrailBucket:
    Type: AWS::S3::Bucket
    Condition: CreateBucket
    Properties:
      BucketName: !Sub 'tagging-trail-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateBucket
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal: { Service: cloudtrail.amazonaws.com }
            Action: s3:PutObject
            Resource: !Sub '${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*'
            Condition:
              StringEquals: { 's3:x-amz-acl': bucket-owner-full-control }

  TrailNewBucket:
    Type: AWS::CloudTrail::Trail
    Condition: CreateBucket
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Ref TrailName
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

  TrailExistingBucket:
    Type: AWS::CloudTrail::Trail
    Condition: UseExistingBucket
    Properties:
      TrailName: !Ref TrailName
      S3BucketName: !Ref TrailS3Bucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true

  # ---------- Step 6: role -> owner map ----------
  RoleOwnerParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /tagging/role-owner-map
      Type: String
      Value: !Ref RoleOwnerMap

  # ---------- shared execution role ----------
  TaggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: tagging
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - tag:GetResources
                  - tag:TagResources
                  - ssm:GetParameter
                  - cloudtrail:LookupEvents
                  - ec2:CreateTags
                  - ec2:Describe*
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:DescribeTags
                  - cloudformation:DescribeStacks
                  - s3:ListAllMyBuckets
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - rds:AddTagsToResource
                  - lambda:TagResource
                  - dynamodb:TagResource
                  - kms:TagResource
                  - sns:TagResource
                  - sqs:TagQueue
                  - elasticfilesystem:TagResource
                  - es:AddTags
                  - elasticache:AddTagsToResource
                  - elasticloadbalancing:AddTags
                  - redshift:CreateTags
                  - redshift-serverless:TagResource
                  - kafka:TagResource
                  - mq:CreateTags
                  - eks:TagResource
                  - ecs:TagResource
                  - elasticmapreduce:AddTags
                  - states:TagResource
                  - sagemaker:AddTags
                  - secretsmanager:TagResource
                  - kinesis:AddTagsToStream
                  - firehose:TagDeliveryStream
                  - backup:TagResource
                  - fsx:TagResource
                  - memorydb:TagResource
                  - glue:TagResource
                  - apigateway:PUT
                  - cloudfront:TagResource
                  - athena:TagResource
                  - logs:TagResource
                  - logs:TagLogGroup
                  - cloudwatch:TagResource
                Resource: '*'

  # ---------- Step 5: event-driven tagger ----------
  TaggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: resource-tagger
      Runtime: python3.12
      Handler: index.main
      Timeout: 120
      Role: !GetAtt TaggingRole.Arn
      Code:
        ZipFile: |
          # Based on aws-samples/resource-tagging-automation (MIT-0)
          #   https://github.com/aws-samples/resource-tagging-automation
          # Retains the upstream per-source dispatch and ARN-extraction pattern.
          # Extended with: additional services (Redshift, MSK, EKS, ECS, Glue, EMR,
          # Step Functions, SageMaker, Secrets Manager, Kinesis, Firehose, Backup, FSx,
          # MemoryDB, DocumentDB, API Gateway, CloudFront, Athena, Logs), and with
          # derived Owner/CreatedBy/ManagedBy resolution + guardrails in place of the
          # upstream static tag map.
          import boto3, os, json

          # ---------------------------------------------------------------- upstream ---
          def aws_ec2(event):
              a=[]; acct=event['account']; reg=event['region']; d=event['detail']; n=d['eventName']
              ec2t=f'arn:aws:ec2:{reg}:{acct}:instance/'; volt=f'arn:aws:ec2:{reg}:{acct}:volume/'
              re_=d.get('responseElements') or {}
              if n=='RunInstances':
                  for i in (re_.get('instancesSet') or {}).get('items',[]):
                      a.append(ec2t+i['instanceId'])
                      try:
                          for v in boto3.resource('ec2').Instance(i['instanceId']).volumes.all(): a.append(volt+v.id)
                      except Exception as e: print("vol lookup:",e)
              elif n=='CreateVolume' and re_.get('volumeId'): a.append(volt+re_['volumeId'])
              elif n=='AllocateAddress' and re_.get('allocationId'):
                  a.append(f"arn:aws:ec2:{reg}:{acct}:elastic-ip/{re_['allocationId']}")
              elif n=='CreateNatGateway':
                  g=(re_.get('natGateway') or {}).get('natGatewayId')
                  if g: a.append(f'arn:aws:ec2:{reg}:{acct}:natgateway/{g}')
              elif n=='CreateVpcEndpoint':
                  e=(re_.get('vpcEndpoint') or {}).get('vpcEndpointId')
                  if e: a.append(f'arn:aws:ec2:{reg}:{acct}:vpc-endpoint/{e}')
              return a

          def aws_elasticloadbalancing(event):
              re_=event['detail'].get('responseElements') or {}
              return [lb['loadBalancerArn'] for lb in re_.get('loadBalancers',[])] if event['detail']['eventName']=='CreateLoadBalancer' else []

          def aws_rds(event):
              re_=event['detail'].get('responseElements') or {}; n=event['detail']['eventName']
              for k in ('dBInstanceArn','dBClusterArn'):
                  if n in ('CreateDBInstance','CreateDBCluster') and re_.get(k): return [re_[k]]
              return []

          def aws_s3(event):
              rp=event['detail'].get('requestParameters') or {}
              return ['arn:aws:s3:::'+rp['bucketName']] if event['detail']['eventName']=='CreateBucket' and rp.get('bucketName') else []

          def aws_lambda(event):
              re_=event['detail'].get('responseElements') or {}
              return [re_['functionArn']] if event['detail']['eventName']=='CreateFunction20150331' and re_.get('functionArn') else []

          def aws_dynamodb(event):
              re_=event['detail'].get('responseElements') or {}
              arn=((re_.get('tableDescription') or {}).get('tableArn'))
              return [arn] if event['detail']['eventName']=='CreateTable' and arn else []

          def aws_kms(event):
              re_=event['detail'].get('responseElements') or {}
              arn=((re_.get('keyMetadata') or {}).get('arn'))
              return [arn] if event['detail']['eventName']=='CreateKey' and arn else []

          def aws_sns(event):
              rp=event['detail'].get('requestParameters') or {}
              return [f"arn:aws:sns:{event['region']}:{event['account']}:{rp['name']}"] if event['detail']['eventName']=='CreateTopic' and rp.get('name') else []

          def aws_sqs(event):
              rp=event['detail'].get('requestParameters') or {}
              return [f"arn:aws:sqs:{event['region']}:{event['account']}:{rp['queueName']}"] if event['detail']['eventName']=='CreateQueue' and rp.get('queueName') else []

          def aws_elasticfilesystem(event):
              re_=event['detail'].get('responseElements') or {}
              fs=re_.get('fileSystemId')
              return [f"arn:aws:elasticfilesystem:{event['region']}:{event['account']}:file-system/{fs}"] if fs else []

          def aws_es(event):
              re_=event['detail'].get('responseElements') or {}
              arn=((re_.get('domainStatus') or {}).get('aRN'))
              return [arn] if arn else []

          def aws_elasticache(event):
              a=[]; re_=event['detail'].get('responseElements') or {}; n=event['detail']['eventName']
              reg=event['region']; acct=event['account']
              if n=='CreateReplicationGroup':
                  for c in re_.get('memberClusters',[]): a.append(f'arn:aws:elasticache:{reg}:{acct}:cluster:{c}')
              elif n=='CreateCacheCluster' and re_.get('aRN'): a.append(re_['aRN'])
              return a

          # ---------------------------------------------------------------- extended ---
          def aws_redshift(event):
              re_=event['detail'].get('responseElements') or {}; n=event['detail']['eventName']
              reg=event['region']; acct=event['account']
              if n=='CreateCluster' and re_.get('clusterIdentifier'):
                  return [f"arn:aws:redshift:{reg}:{acct}:cluster:{re_['clusterIdentifier']}"]
              if n=='CreateWorkgroup':
                  w=(re_.get('workgroup') or {}).get('workgroupArn')
                  return [w] if w else []
              if n=='CreateNamespace':
                  ns=(re_.get('namespace') or {}).get('namespaceArn')
                  return [ns] if ns else []
              return []

          def aws_kafka(event):   # Amazon MSK
              re_=event['detail'].get('responseElements') or {}
              for k in ('clusterArn','ClusterArn'):
                  if re_.get(k): return [re_[k]]
              return []

          def aws_eks(event):
              re_=event['detail'].get('responseElements') or {}
              for path in (('cluster','arn'),('nodegroup','nodegroupArn'),('fargateProfile','fargateProfileArn')):
                  v=(re_.get(path[0]) or {}).get(path[1])
                  if v: return [v]
              return []

          def aws_ecs(event):
              re_=event['detail'].get('responseElements') or {}
              for path in (('cluster','clusterArn'),('service','serviceArn')):
                  v=(re_.get(path[0]) or {}).get(path[1])
                  if v: return [v]
              return []

          def aws_emr(event):
              re_=event['detail'].get('responseElements') or {}
              j=re_.get('jobFlowId')
              return [f"arn:aws:elasticmapreduce:{event['region']}:{event['account']}:cluster/{j}"] if j else []

          def aws_states(event):
              re_=event['detail'].get('responseElements') or {}
              return [re_['stateMachineArn']] if re_.get('stateMachineArn') else []

          def aws_sagemaker(event):
              re_=event['detail'].get('responseElements') or {}
              for k in ('notebookInstanceArn','endpointArn','domainArn','trainingJobArn','modelArn'):
                  if re_.get(k): return [re_[k]]
              return []

          def aws_secretsmanager(event):
              re_=event['detail'].get('responseElements') or {}
              return [re_['aRN']] if re_.get('aRN') else []

          def aws_kinesis(event):
              rp=event['detail'].get('requestParameters') or {}
              s=rp.get('streamName')
              return [f"arn:aws:kinesis:{event['region']}:{event['account']}:stream/{s}"] if s else []

          def aws_firehose(event):
              re_=event['detail'].get('responseElements') or {}
              return [re_['deliveryStreamARN']] if re_.get('deliveryStreamARN') else []

          def aws_backup(event):
              re_=event['detail'].get('responseElements') or {}
              return [re_['backupVaultArn']] if re_.get('backupVaultArn') else []

          def aws_fsx(event):
              re_=event['detail'].get('responseElements') or {}
              fs=(re_.get('fileSystem') or {}).get('resourceARN')
              return [fs] if fs else []

          def aws_memorydb(event):
              re_=event['detail'].get('responseElements') or {}
              c=(re_.get('cluster') or {}).get('aRN')
              return [c] if c else []

          def aws_glue(event):
              rp=event['detail'].get('requestParameters') or {}; n=event['detail']['eventName']
              reg=event['region']; acct=event['account']
              if n=='CreateJob' and rp.get('name'):     return [f'arn:aws:glue:{reg}:{acct}:job/{rp["name"]}']
              if n=='CreateCrawler' and rp.get('name'): return [f'arn:aws:glue:{reg}:{acct}:crawler/{rp["name"]}']
              if n=='CreateDatabase':
                  d=(rp.get('databaseInput') or {}).get('name')
                  return [f'arn:aws:glue:{reg}:{acct}:database/{d}'] if d else []
              return []

          def aws_apigateway(event):
              re_=event['detail'].get('responseElements') or {}
              i=re_.get('id')
              return [f"arn:aws:apigateway:{event['region']}::/restapis/{i}"] if i else []

          def aws_cloudfront(event):
              re_=event['detail'].get('responseElements') or {}
              d=(re_.get('distribution') or {}).get('aRN')
              return [d] if d else []

          def aws_athena(event):
              rp=event['detail'].get('requestParameters') or {}
              w=rp.get('name')
              return [f"arn:aws:athena:{event['region']}:{event['account']}:workgroup/{w}"] if w else []

          def aws_logs(event):
              rp=event['detail'].get('requestParameters') or {}
              g=rp.get('logGroupName')
              return [f"arn:aws:logs:{event['region']}:{event['account']}:log-group:{g}"] if g else []

          # ------------------------------------------------ resolution + guardrails ---
          ssm=boto3.client('ssm'); tagapi=boto3.client('resourcegroupstaggingapi')

          def role_map():
              try: return json.loads(ssm.get_parameter(Name='/tagging/role-owner-map')['Parameter']['Value'])
              except Exception: return {}

          # Session names that identify an SDK/agent rather than a human.
          GENERIC_SESSIONS = ('botocore-session', 'aws-go-sdk', 'aws-sdk', 'AutoScaling',
                              'OrganizationAccountAccessRole', 'AWSCloudFormation')

          def looks_like_user(sess):
              """True when the role session name identifies a person."""
              if not sess or sess.startswith('i-'):
                  return False
              if sess.startswith(GENERIC_SESSIONS):
                  return False
              return '@' in sess or '.' in sess or sess.isalnum()

          def resolve(ui):
              """Return (Owner, CreatedBy, ManagedBy).

              Owner resolution prefers the real human identity wherever it is
              discoverable, falling back to the role -> owner map only for machine
              principals:
                1. IAM user            -> userName
                2. Federated user      -> session name (IAM Identity Center / SAML)
                3. Assumed role with a person-like session name -> that session name
                4. Service principal / instance profile -> 'inherit'
                5. Anything else       -> role map, else 'unresolved'
              """
              arn=ui.get('arn') or ''; invoked=ui.get('invokedBy')
              issuer=(ui.get('sessionContext') or {}).get('sessionIssuer') or {}
              created=arn or invoked or ui.get('type','unknown')
              if invoked:                       return ('inherit', created, invoked.split('.')[0])
              if ui.get('type')=='IAMUser':     return (ui.get('userName','unresolved'), created, 'manual')
              sess=arn.split('/')[-1] if '/' in arn else ''
              # Federated: the session name IS the identity store username.
              if 'AWSReservedSSO' in (issuer.get('arn') or '') or 'saml' in (issuer.get('arn') or '').lower():
                  return (sess or 'unresolved', created, 'federated')
              if sess.startswith('i-'):         return ('inherit', created, 'instance-profile')
              # Any other assumed role whose session names a person.
              if looks_like_user(sess):         return (sess, created, 'manual')
              # Machine principal: role -> owner map (may pin a specific user).
              return (role_map().get(issuer.get('userName',''), 'unresolved'), created, 'manual')

          def current(arn):
              r=tagapi.get_resources(ResourceARNList=[arn]).get('ResourceTagMappingList',[])
              return {t['Key']:t['Value'] for t in r[0]['Tags']} if r else {}

          def main(event, context):
              src=event.get('source','').replace('.','_')
              fn=globals().get(src)
              if not fn:
                  print(f"UNHANDLED source={event.get('source')} eventName={(event.get('detail') or {}).get('eventName')}")
                  return {'statusCode':200,'body':'unhandled source'}
              try: arns=fn(event) or []
              except Exception as e:
                  print("extractor error:",e); arns=[]
              ui=(event.get('detail') or {}).get('userIdentity') or {}
              owner, created, managed = resolve(ui)
              print(f"source={event.get('source')} event={(event.get('detail') or {}).get('eventName')} arns={arns} owner={owner}")
              applied=0
              for arn in arns:
                  try: cur=current(arn)
                  except Exception: cur={}
                  if 'ManagedBy' in cur: print("SKIP (ManagedBy set):",arn); continue
                  if cur.get('Owner','').endswith('.amazonaws.com'): print("SKIP (AWS-owned):",arn); continue
                  tags={'CreatedBy':created[:255],'ManagedBy':managed}
                  tags['Owner']= owner if owner!='inherit' else cur.get('Owner','unresolved')
                  try:
                      tagapi.tag_resources(ResourceARNList=[arn],Tags=tags); applied+=1
                      print("TAGGED",arn,tags)
                  except Exception as e: print("tag failed",arn,e)
              return {'statusCode':200,'body':json.dumps({'tagged':applied})}


  TaggerRule:
    Type: AWS::Events::Rule
    Properties:
      Name: resource-tagger-creations
      Description: Resource creation events routed to the tagger
      EventPattern:
        detail-type: ['AWS API Call via CloudTrail']
        source:
          - aws.ec2
          - aws.s3
          - aws.rds
          - aws.lambda
          - aws.dynamodb
          - aws.kms
          - aws.sns
          - aws.sqs
          - aws.elasticfilesystem
          - aws.es
          - aws.elasticache
          - aws.elasticloadbalancing
          - aws.redshift
          - aws.kafka
          - aws.amazonmq
          - aws.eks
          - aws.ecs
          - aws.emr
          - aws.states
          - aws.sagemaker
          - aws.secretsmanager
          - aws.kinesis
          - aws.firehose
          - aws.backup
          - aws.fsx
          - aws.memorydb
          - aws.glue
          - aws.apigateway
          - aws.cloudfront
          - aws.athena
          - aws.logs
          - aws.monitoring
      Targets:
        - Arn: !GetAtt TaggerFunction.Arn
          Id: tagger

  TaggerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt TaggerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TaggerRule.Arn

  # ---------- Step 4: reconciliation sweep ----------
  SweepFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: tagging-sweep
      Runtime: python3.12
      Handler: index.main
      Timeout: 300
      Role: !GetAtt TaggingRole.Arn
      Environment:
        Variables:
          ACCT: !Ref AWS::AccountId
      Code:
        ZipFile: |
          import os, json, boto3
          REGION=os.environ.get("AWS_REGION","us-west-2"); ACCT=os.environ["ACCT"]
          ec2=boto3.client("ec2",region_name=REGION)
          asg=boto3.client("autoscaling",region_name=REGION)
          cfn=boto3.client("cloudformation",region_name=REGION)
          s3=boto3.client("s3",region_name=REGION)
          ct=boto3.client("cloudtrail",region_name=REGION)
          ssm=boto3.client("ssm",region_name=REGION)
          tagapi=boto3.client("resourcegroupstaggingapi",region_name=REGION)
          REQUIRED=("Owner","CreatedBy","ManagedBy")

          def tags_of(l): return {t["Key"]:t["Value"] for t in (l or [])}

          def stack_owner(name,cache={}):
              if name in cache: return cache[name]
              try:
                  t={x["Key"]:x["Value"] for x in cfn.describe_stacks(StackName=name)["Stacks"][0].get("Tags",[])}
                  cache[name]=t.get("Owner")
              except Exception: cache[name]=None
              return cache[name]

          def asg_owner(name,cache={}):
              if name in cache: return cache[name]
              try:
                  t=asg.describe_tags(Filters=[{"Name":"auto-scaling-group","Values":[name]},
                                               {"Name":"key","Values":["Owner"]}])["Tags"]
                  cache[name]=t[0]["Value"] if t else None
              except Exception: cache[name]=None
              return cache[name]

          def identity_from_cloudtrail(evname, needle):
              """Return the userIdentity block of the event that created `needle`."""
              try:
                  tok=None
                  for _ in range(6):
                      kw=dict(LookupAttributes=[{"AttributeKey":"EventName","AttributeValue":evname}],MaxResults=50)
                      if tok: kw["NextToken"]=tok
                      r=ct.lookup_events(**kw)
                      for e in r.get("Events",[]):
                          if needle in e.get("CloudTrailEvent",""):
                              import json as j
                              return j.loads(e["CloudTrailEvent"]).get("userIdentity",{})
                      tok=r.get("NextToken")
                      if not tok: break
              except Exception as ex: print("ct lookup failed",ex)
              return None

          GENERIC_SESSIONS = ('botocore-session','aws-go-sdk','aws-sdk','AutoScaling',
                              'OrganizationAccountAccessRole','AWSCloudFormation')

          def role_map():
              try: return json.loads(ssm.get_parameter(Name="/tagging/role-owner-map")["Parameter"]["Value"])
              except Exception: return {}

          def looks_like_user(sess):
              if not sess or sess.startswith('i-'): return False
              if sess.startswith(GENERIC_SESSIONS): return False
              return '@' in sess or '.' in sess or sess.isalnum()

          def resolve(ui):
              """Same resolution the event-driven tagger uses."""
              if not ui: return (None, None, None)
              arn=ui.get('arn') or ''; invoked=ui.get('invokedBy')
              issuer=(ui.get('sessionContext') or {}).get('sessionIssuer') or {}
              created=arn or invoked or ui.get('type','unknown')
              if invoked: return ('inherit', created, invoked.split('.')[0])
              if ui.get('type')=='IAMUser': return (ui.get('userName','unresolved'), created, 'manual')
              sess=arn.split('/')[-1] if '/' in arn else ''
              if 'AWSReservedSSO' in (issuer.get('arn') or '') or 'saml' in (issuer.get('arn') or '').lower():
                  return (sess or 'unresolved', created, 'federated')
              if sess.startswith('i-'): return ('inherit', created, 'instance-profile')
              if looks_like_user(sess): return (sess, created, 'manual')
              return (role_map().get(issuer.get('userName',''), 'unresolved'), created, 'manual')

          def apply(arn,tags,why):
              if not tags: return 0
              tagapi.tag_resources(ResourceARNList=[arn],Tags=tags)
              print(f"{why} {arn} {tags}"); return 1

          def main(event, context):
              fixed=0
              inst={}
              for r in ec2.describe_instances()["Reservations"]:
                  for i in r["Instances"]:
                      if i["State"]["Name"] in ("terminated","shutting-down"): continue
                      inst[i["InstanceId"]]=tags_of(i.get("Tags"))
              # 1. instances
              for iid,t in inst.items():
                  need={}
                  ui = None
                  if t.get("Owner") in (None,"unresolved") or "CreatedBy" not in t or "ManagedBy" not in t:
                      ui = identity_from_cloudtrail("RunInstances", iid)
                  owner, created, managed = resolve(ui) if ui else (None,None,None)
                  if t.get("Owner") in (None,"unresolved"):
                      o=None
                      if t.get("aws:autoscaling:groupName"): o=asg_owner(t["aws:autoscaling:groupName"])
                      if not o and t.get("aws:cloudformation:stack-name"): o=stack_owner(t["aws:cloudformation:stack-name"])
                      if not o and owner and owner!="inherit": o=owner
                      if o and o!=t.get("Owner"): need["Owner"]=o
                  if "CreatedBy" not in t and created: need["CreatedBy"]=created[:255]
                  if "ManagedBy" not in t:
                      need["ManagedBy"]= "asg" if t.get("aws:autoscaling:groupName") else (managed or "manual")
                  fixed+=apply(f"arn:aws:ec2:{REGION}:{ACCT}:instance/{iid}",need,"FIX instance")
                  if need: t.update(need)

              # 2. volumes inherit from attached instance
              for v in ec2.describe_volumes()["Volumes"]:
                  vt=tags_of(v.get("Tags")); need={}
                  parent=next((a.get("InstanceId") for a in v.get("Attachments",[])),None)
                  pt=inst.get(parent,{})
                  for k in REQUIRED:
                      stale = vt.get(k) in (None, "unresolved")
                      if stale and pt.get(k) and pt[k] != "unresolved" and pt[k] != vt.get(k):
                          need[k]=pt[k]
                  fixed+=apply(f"arn:aws:ec2:{REGION}:{ACCT}:volume/{v['VolumeId']}",need,"FIX volume")
              # 3. S3 buckets
              for b in s3.list_buckets()["Buckets"]:
                  name=b["Name"]
                  try: bt={t["Key"]:t["Value"] for t in s3.get_bucket_tagging(Bucket=name)["TagSet"]}
                  except Exception: bt={}
                  need={}
                  ui=identity_from_cloudtrail("CreateBucket",name) if ("CreatedBy" not in bt or bt.get("Owner") in (None,"unresolved")) else None
                  bowner,bcreated,bmanaged=resolve(ui) if ui else (None,None,None)
                  if "CreatedBy" not in bt: need["CreatedBy"]=(bcreated or "pre-existing")[:255]
                  if bt.get("Owner") in (None,"unresolved") and bowner and bowner!="inherit": need["Owner"]=bowner
                  if "ManagedBy" not in bt: need["ManagedBy"]=bmanaged or "manual"
                  fixed+=apply(f"arn:aws:s3:::{name}",need,"FIX bucket")
              print(f"SWEEP complete: {fixed} resources updated")
              return {"fixed":fixed}


  SweepScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: tagging-sweep-schedule
      ScheduleExpression: !Ref SweepSchedule
      Targets:
        - Arn: !GetAtt SweepFunction.Arn
          Id: sweep

  SweepInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt SweepFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SweepScheduleRule.Arn

  # ---------- Step 8: detective reporting ----------
  RequiredTagsRule:
    Type: AWS::Config::ConfigRule
    Condition: WantConfigRule
    Properties:
      ConfigRuleName: required-tags-mandatory
      Description: Owner, CreatedBy and ManagedBy must be present
      Scope:
        ComplianceResourceTypes:
          - AWS::EC2::Instance
          - AWS::EC2::Volume
          - AWS::S3::Bucket
      Source:
        Owner: AWS
        SourceIdentifier: REQUIRED_TAGS
      InputParameters:
        tag1Key: Owner
        tag2Key: CreatedBy
        tag3Key: ManagedBy

Outputs:
  TaggerFunctionName:
    Value: !Ref TaggerFunction
  SweepFunctionName:
    Value: !Ref SweepFunction
  TrailArn:
    Value: !If [CreateBucket, !GetAtt TrailNewBucket.Arn, !GetAtt TrailExistingBucket.Arn]
  RoleOwnerMapParameter:
    Value: !Ref RoleOwnerParameter
